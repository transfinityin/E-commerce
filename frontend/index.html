    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Instant first paint before the JS bundle — keeps the Vercel wait branded */
      html, body { margin: 0; background: #F4F4F2; }
      #tf-shell {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 55% 45% at 50% 42%, rgba(200,169,110,0.2), transparent 62%),
          linear-gradient(180deg, #F7F6F3 0%, #F4F4F2 45%, #EFEFEF 100%);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        color: #171717;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #tf-shell.tf-shell-out {
        opacity: 0; visibility: hidden; pointer-events: none;
      }
      #tf-shell .tf-shell-eyebrow {
        font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase;
        color: #737373; margin: 0 0 2rem;
      }
      #tf-shell .tf-shell-mark {
        width: 120px; height: 56px; margin-bottom: 2.25rem;
      }
      #tf-shell .tf-shell-mark path {
        stroke-dasharray: 280; stroke-dashoffset: 280;
        animation: tf-shell-draw 2.4s ease forwards infinite alternate;
      }
      #tf-shell h1 {
        margin: 0; text-align: center;
        font-family: Cinzel, Georgia, serif;
        font-size: clamp(2rem, 8vw, 3.25rem);
        font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
        line-height: 1;
      }
      #tf-shell h1 span {
        display: block; margin-top: 0.35rem;
        font-size: 0.55em; letter-spacing: 0.28em; color: #737373;
      }
      #tf-shell .tf-shell-hint {
        margin-top: 2.5rem; font-size: 10px; letter-spacing: 0.2em;
        text-transform: uppercase; color: #a3a3a3;
      }
      #tf-shell .tf-shell-bar {
        width: min(220px, 55vw); height: 3px; margin-top: 2.5rem;
        border-radius: 999px; background: rgba(23,23,23,0.08); overflow: hidden;
      }
      #tf-shell .tf-shell-bar > i {
        display: block; height: 100%; width: 18%;
        border-radius: 999px; background: #171717;
        animation: tf-shell-bar 1.6s ease-in-out infinite;
      }
      @keyframes tf-shell-draw {
        from { stroke-dashoffset: 280; opacity: 0.55; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes tf-shell-bar {
        0% { width: 12%; transform: translateX(0); }
        50% { width: 55%; transform: translateX(40%); }
        100% { width: 12%; transform: translateX(180%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tf-shell .tf-shell-mark path,
        #tf-shell .tf-shell-bar > i { animation: none; }
        #tf-shell .tf-shell-mark path { stroke-dashoffset: 0; }
        #tf-shell .tf-shell-bar > i { width: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="tf-shell" aria-hidden="true">
      <p class="tf-shell-eyebrow">Transfinity</p>
      <svg class="tf-shell-mark" viewBox="0 0 120 56" fill="none" aria-hidden="true">
        <path d="M20 28c0-10 8-18 20-18 14 0 22 18 40 18s26-8 26-18-12-18-26-18c-18 0-26 18-40 18S8 18 8 28s12 18 26 18c14 0 22-18 40-18s26 8 26 18-12 18-26 18c-18 0-26-18-40-18S20 38 20 28z" stroke="#171717" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <h1>Beyond<span>The Limits</span></h1>
      <div class="tf-shell-bar"><i></i></div>
      <p class="tf-shell-hint">Opening the shop</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
