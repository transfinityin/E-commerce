version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: transfinity_db
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: transfinity_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/staticfiles
      - /app/media
    env_file:
      - .env
    environment:
      # Keep local Docker overrides (friend .env has production DB/URLs)
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ecommerce_db
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: transfinity_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend

volumes:
  postgres_data: